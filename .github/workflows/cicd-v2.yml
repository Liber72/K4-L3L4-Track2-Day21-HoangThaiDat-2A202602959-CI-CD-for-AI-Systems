name: Income Model CI/CD v2

on:
  push:
    branches: [main]
    paths:
      - 'data/**/*.dvc'
      - '.dvc/config'
      - 'src/**/*.py'
      - 'scripts/**/*.py'
      - 'tests/**/*.py'
      - 'params.yaml'
      - 'requirements*.txt'
      - 'pytest.ini'
      - '.github/workflows/cicd-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

# Do not let a second run overwrite the model while the first is deploying.
concurrency:
  group: income-cicd-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Authenticate to S3
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: python scripts/configure_aws.py
      - name: Pull training and holdout data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
          MLFLOW_ARTIFACT_ROOT: ./mlartifacts
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("outputs/report.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write(f"f1={report['f1_score']}\n")
          print(f"F1: {report['f1_score']:.4f} | Accuracy: {report['accuracy']:.4f}")
          PY
      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json
          if-no-files-found: error
      - name: Save candidate model for Release
        uses: actions/upload-artifact@v4
        with:
          name: candidate-model
          path: |
            models/model.joblib
            outputs/report.json
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Require positive-class F1 >= 0.65
        env:
          MODEL_F1: ${{ needs.train.outputs.f1 }}
        run: python -m src.quality_gate --f1 "$MODEL_F1"

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
      EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install S3 SDK
        run: python -m pip install boto3==1.34.106
      - name: Authenticate to S3
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: python scripts/configure_aws.py
      - name: Download candidate from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: candidate-model
          path: .
      - name: Allow SSH from this runner only
        run: bash scripts/runner_ssh.sh open
      - name: Publish approved model and report to S3
        run: python -m src.publish_model
      - name: Copy serving code to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "src/serve.py,src/__init__.py,requirements-serving.txt"
          target: "/home/${{ secrets.SERVER_USER }}/income-app"
      - name: Restart API and verify readiness
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            cd "$HOME/income-app"
            .venv/bin/python -m pip install -r requirements-serving.txt
            sudo -n systemctl restart income-api
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/healthz; then
                echo "Health check passed."
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed."
            sudo -n journalctl -u income-api -n 30 --no-pager || true
            exit 1
      - name: Revoke temporary runner SSH access
        if: ${{ always() }}
        run: bash scripts/runner_ssh.sh close
